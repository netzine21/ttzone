<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="탁구장 운영자를 위한 게임 생성과 회원 관리 MVP"
    />
    <meta name="theme-color" content="#08111d" />
    <title>탁구장 게임관리 시스템</title>
    <link rel="stylesheet" href="public/styles.css" />
    <script src="public/app.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="#" data-home aria-label="탁구장 게임관리 시스템 초기화면">
          <div class="brand-mark" aria-hidden="true">
            <svg class="brand-mark__icon" viewBox="0 0 52 52" role="img" aria-label="탁구 라켓과 공">
              <circle cx="37" cy="14" r="4" class="brand-mark__ball" />
              <g transform="rotate(-28 20 24)">
                <ellipse cx="17" cy="19" rx="9" ry="12" class="brand-mark__paddle brand-mark__paddle--one" />
                <path d="M20 29 L28 42" class="brand-mark__handle" />
              </g>
              <g transform="rotate(28 32 24)">
                <ellipse cx="35" cy="19" rx="9" ry="12" class="brand-mark__paddle brand-mark__paddle--two" />
                <path d="M32 29 L24 42" class="brand-mark__handle" />
              </g>
            </svg>
          </div>
          <div>
            <p class="brand-name">탁구장 게임관리 시스템</p>
          </div>
        </a>
        <div class="topbar-actions">
          <div class="auth-actions" id="topActions"></div>
        </div>
      </header>

      <main id="app" class="app" aria-live="polite"></main>
    </div>
    <noscript>
      <div class="noscript">
        이 서비스는 자바스크립트가 필요합니다. 브라우저에서 JavaScript를 활성화해 주세요.
      </div>
    </noscript>
  </body>
</html>
